# DroidLink - 4 MIDI-Stimmen zum patch.init() ueber 1 CV + 1 Gate
# ===============================================================
#
# Verkabelung
#   O7 -> patch.init() CV In 4    (Daten)
#   O8 -> patch.init() Gate In 2  (Takt)
#   MIDI ueber das X7: TRS oder USB, wird automatisch erkannt
#
# Protokoll (Details: docs/droid_link.md im Repo patch_init()_firmwares)
#   Pro Takt-Periode (Slot) ein Spannungswert, ein Rahmen = 11 Slots:
#   SYNC +4V | REF 0V | AUX1 | NOTE1 VEL1 | NOTE2 VEL2 | NOTE3 VEL3 | NOTE4 VEL4
#   NOTE    = Pitch (1V/Okt, 0V = MIDI-Note 60) solange das Gate an ist, sonst -4V
#   VEL/AUX = Wert 0..1 mal 3.5V
#
# Die Reihenfolge der Circuits nicht aendern (lfo -> switch -> sample),
# damit Takt und Daten im selben DROID-Zyklus wechseln.
# Braucht zwei freie Ausgaenge (hier O7/O8) - zum Einbau in einen
# bestehenden Patch einfach die Ausgaenge anpassen.

[midiin]
    transpose    = -3V    # MIDI-Note 60 -> 0V (Bezugspunkt des Protokolls)
    lowestnote   = 20     # -3.33V; mit Pitchbend +-2 HT bleibt alles in +-3.5V
    highestnote  = 100    # +3.33V
    roundrobin   = 1      # wiederholte Noten landen auf einer freien Stimme -> neuer Anschlag
    holdvelocity = 1      # Velocity bleibt im Release erhalten
    # notegap    = 15     # bei mehr als 4 Tasten: geklaute Stimme neu anschlagen statt legato
    pitch1       = _PITCH1
    pitch2       = _PITCH2
    pitch3       = _PITCH3
    pitch4       = _PITCH4
    gate1        = _GATE1
    gate2        = _GATE2
    gate3        = _GATE3
    gate4        = _GATE4
    velocity1    = _VEL1
    velocity2    = _VEL2
    velocity3    = _VEL3
    velocity4    = _VEL4
    modwheel     = _MODWHEEL

# NOTE-Slot = Gate an ? Pitch : -4V
# DROID rechnet nur A * B + C, daher: Gate * (Pitch + 4V) - 4V
[copy]
    input  = _PITCH1 + 4V
    output = _PITCH1_UP

[copy]
    input  = _PITCH2 + 4V
    output = _PITCH2_UP

[copy]
    input  = _PITCH3 + 4V
    output = _PITCH3_UP

[copy]
    input  = _PITCH4 + 4V
    output = _PITCH4_UP

# Takt: steigende Flanke = naechster Slot, das patch.init() tastet an der
# fallenden Flanke ab (bei 75 % des Slots, der Wert ist dann eingeschwungen).
# Rahmenrate = hz / 11, also ca. 90 Rahmen pro Sekunde.
# Zeigt der patch.init()-Monitor Einschwingfehler: hz auf 500 senken.
[lfo]
    hz         = 1000
    pulsewidth = 0.75
    square     = _CLOCK

[switch]
    forward = _CLOCK
    input1  = 4V                          # SYNC
    input2  = 0                           # REF
    input3  = _MODWHEEL * 3.5V            # AUX1 (bis zu 6 Aux-Slots moeglich)
    input4  = _GATE1 * _PITCH1_UP - 4V    # NOTE1
    input5  = _VEL1 * 3.5V                # VEL1
    input6  = _GATE2 * _PITCH2_UP - 4V    # NOTE2
    input7  = _VEL2 * 3.5V                # VEL2
    input8  = _GATE3 * _PITCH3_UP - 4V    # NOTE3
    input9  = _VEL3 * 3.5V                # VEL3
    input10 = _GATE4 * _PITCH4_UP - 4V    # NOTE4
    input11 = _VEL4 * 3.5V                # VEL4
    output  = _SLOT

# Slotwert festhalten, auch wenn sich mitten im Slot eine Note aendert
[sample]
    input  = _SLOT
    sample = _CLOCK
    output = O7

[copy]
    input  = _CLOCK * 0.5                 # 5V-Gate
    output = O8

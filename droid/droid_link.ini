# DroidLink - 4 MIDI-Stimmen zum patch.init() ueber 1 CV + 1 Gate
# ===============================================================
#
# Verkabelung
#   O7 -> patch.init() CV In 4    (Daten)
#   O8 -> patch.init() Gate In 2  (Takt)
#   MIDI ueber das X7: TRS oder USB, wird automatisch erkannt
#
# Protokoll (Details: docs/droid_link.md im Repo patch_init()_firmwares)
#   Pro Takt-Periode (Slot) ein Spannungswert, ein Rahmen = 11 Slots:
#   SYNC +4V | REF 0V | AUX1 | NOTE1 VEL1 | NOTE2 VEL2 | NOTE3 VEL3 | NOTE4 VEL4
#   NOTE    = Pitch (1V/Okt, 0V = MIDI-Note 60) solange das Gate an ist, sonst -4V
#   VEL/AUX = Wert 0..1 mal 3.5V
#
# Die Reihenfolge der Circuits nicht aendern (lfo -> switch -> sample),
# damit Takt und Daten im selben DROID-Zyklus wechseln.
# Braucht zwei freie Ausgaenge (hier O7/O8) - zum Einbau in einen
# bestehenden Patch einfach die Ausgaenge anpassen. Kein anderer Circuit
# darf dann noch auf diese Ausgaenge schreiben.
#
# Diagnose am MASTER (Block am Ende, kann entfallen):
#   LED Ausgang 8  blinkt gruen 2x pro Sekunde = Takt laeuft
#   LED Ausgang 7  leuchtet blau, solange eine Taste gehalten wird
#   Die beiden LEDs zeigen dann nicht mehr die Spannung von O7/O8.

[midiin]
    transpose    = -3V    # MIDI-Note 60 -> 0V (Bezugspunkt des Protokolls)
    lowestnote   = 20     # -3.33V; mit Pitchbend +-2 HT bleibt alles in +-3.5V
    highestnote  = 100    # +3.33V
    roundrobin   = 1      # wiederholte Noten landen auf einer freien Stimme -> neuer Anschlag
    holdvelocity = 1      # Velocity bleibt im Release erhalten
    # notegap    = 15     # bei mehr als 4 Tasten: geklaute Stimme neu anschlagen statt legato
    pitch1       = _PITCH1
    pitch2       = _PITCH2
    pitch3       = _PITCH3
    pitch4       = _PITCH4
    gate1        = _GATE1
    gate2        = _GATE2
    gate3        = _GATE3
    gate4        = _GATE4
    velocity1    = _VEL1
    velocity2    = _VEL2
    velocity3    = _VEL3
    velocity4    = _VEL4
    modwheel     = _MODWHEEL

# NOTE-Slot = Gate an ? Pitch : -4V
# DROID rechnet nur A * B + C, daher: Gate * (Pitch + 4V) - 4V
[copy]
    input  = _PITCH1 + 4V
    output = _PITCH1_UP

[copy]
    input  = _PITCH2 + 4V
    output = _PITCH2_UP

[copy]
    input  = _PITCH3 + 4V
    output = _PITCH3_UP

[copy]
    input  = _PITCH4 + 4V
    output = _PITCH4_UP

# Takt: steigende Flanke = naechster Slot. Das patch.init() tastet 0,5 ms
# davor ab (spaet im alten Slot, der Wert ist dann eingeschwungen).
# Rahmenrate = hz / 11, also ca. 36 Rahmen pro Sekunde.
# Der DROID rechnet nur mit 3-6 kHz und glaettet seine Ausgaenge (ca. 0,2 ms).
# Die Low-Phase des Takts muss deshalb mehrere DROID-Zyklen lang sein: bei
# 1000 Hz und 75 % (0,25 ms Low) kam sie am patch.init() kaum an.
# 400 Hz: 2,5 ms pro Slot, davon bleiben nach dem Abtastabstand noch ca.
# 1,7 ms zum Einschwingen. Bei 500 Hz waren es zu wenig (Geister-Noten).
[lfo]
    hz         = 400
    pulsewidth = 0.5
    square     = _CLOCK

[switch]
    forward = _CLOCK
    input1  = 4V                          # SYNC
    input2  = 0                           # REF
    input3  = _MODWHEEL * 3.5V            # AUX1 (bis zu 6 Aux-Slots moeglich)
    input4  = _GATE1 * _PITCH1_UP - 4V    # NOTE1
    input5  = _VEL1 * 3.5V                # VEL1
    input6  = _GATE2 * _PITCH2_UP - 4V    # NOTE2
    input7  = _VEL2 * 3.5V                # VEL2
    input8  = _GATE3 * _PITCH3_UP - 4V    # NOTE3
    input9  = _VEL3 * 3.5V                # VEL3
    input10 = _GATE4 * _PITCH4_UP - 4V    # NOTE4
    input11 = _VEL4 * 3.5V                # VEL4
    output  = _SLOT

# Slotwert festhalten, auch wenn sich mitten im Slot eine Note aendert
[sample]
    input  = _SLOT
    sample = _CLOCK
    output = O7

[copy]
    input  = _CLOCK * 0.5                 # 5V-Gate
    output = O8

# --- Diagnose: LEDs von O7/O8 am MASTER (R15/R16) ---------------------
# Der Takt ist fuer das Auge zu schnell, deshalb geteilt:
# 400 Hz / 200 = 2 Hz. Farben: 0.4 = gruen, 1.2 = blau, 0 = aus.
[clocktool]
    clock     = _CLOCK
    divide    = 200
    dutycycle = 0.5
    output    = _HEARTBEAT

[copy]
    input  = _HEARTBEAT * 0.4
    output = R16                          # LED Ausgang 8

[logic]
    input1 = _GATE1
    input2 = _GATE2
    input3 = _GATE3
    input4 = _GATE4
    or     = _ANYGATE

[copy]
    input  = _ANYGATE * 1.2
    output = R15                          # LED Ausgang 7
